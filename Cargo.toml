[workspace]
members = ["crates/protocol", "crates/session", "crates/transport", "apps/remote-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-socks = "0.5"
tempfile = "3"
jpeg-encoder = "0.7"
jpeg-decoder = { version = "0.3", default-features = false }
minifb = { version = "0.29", default-features = false }
screencapturekit = { version = "11", features = ["macos_14_0"] }
zeroize = "1"
rpassword = "7"
