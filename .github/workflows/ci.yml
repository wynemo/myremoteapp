name: Build MyRemoteApp

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: ${{ matrix.platform }} release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - runner: macos-26
            platform: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode for ScreenCaptureKit bridge
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-v1-${{ matrix.runner }}-${{ matrix.target }}-rust-1.98.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            release-v1-${{ matrix.runner }}-${{ matrix.target }}-rust-1.98.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.github/workflows/ci.yml') }}-
            release-v1-${{ matrix.runner }}-${{ matrix.target }}-rust-1.98.0-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --release --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test
        run: cargo test --locked --release --workspace --target ${{ matrix.target }}

      - name: Test native macOS preview coordinates
        if: runner.os == 'macOS'
        run: bash scripts/test_preview_geometry.sh

      - name: Build release binary
        run: cargo build --locked --release -p remote-cli --target ${{ matrix.target }}

      - name: Smoke check native binary
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          binary="target/$BUILD_TARGET/release/remote-cli"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --help

      - name: Smoke check graphical client
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          binary="target/$BUILD_TARGET/release/remote-cli"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          args=(--binary "$binary")
          if [[ "$RUNNER_OS" == Windows ]]; then args+=(--test-keyboard); fi
          python scripts/smoke_viewer.py "${args[@]}"

      - name: Package and verify architecture
        id: package
        run: python scripts/package.py --target ${{ matrix.target }}

      - name: Upload build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: myremoteapp-${{ steps.package.outputs.version }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: myremoteapp-*
          path: dist
          merge-multiple: true

      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*.zip dist/*.tar.gz dist/*.sha256)
          if (( ${#assets[@]} != 4 )); then
            echo 'Expected two platform archives and two checksums' >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
