[package]
name = "remote-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
rcgen.workspace = true
remote-session = { path = "../../crates/session" }
remote-transport = { path = "../../crates/transport" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
remote-protocol = { path = "../../crates/protocol" }
jpeg-decoder.workspace = true
zeroize.workspace = true
rpassword.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit.workspace = true
jpeg-encoder.workspace = true
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
minifb.workspace = true

[dev-dependencies]
jpeg-encoder.workspace = true
