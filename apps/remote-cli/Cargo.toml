[package]
name = "remote-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
rcgen.workspace = true
remote-session = { path = "../../crates/session" }
remote-transport = { path = "../../crates/transport" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
remote-protocol = { path = "../../crates/protocol" }
jpeg-decoder.workspace = true
zeroize.workspace = true
rpassword.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit.workspace = true
# minifb 0.29's build script checks "macos" instead of the Rust "darwin"
# target name. This feature bypasses that check; its X11 dependencies are
# excluded on macOS, which still uses the native AppKit/Metal backend.
minifb = { workspace = true, features = ["x11"] }
jpeg-encoder.workspace = true
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
minifb.workspace = true
jpeg-encoder.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops", "Win32_Security"] }

[dev-dependencies]
jpeg-encoder.workspace = true

[build-dependencies]
cc = "1"
